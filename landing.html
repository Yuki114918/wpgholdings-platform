<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人事小 i · 开放式工作平台</title>
<style>
  :root{
    --c1:#FF8A3D; --c2:#FF5E8A; --c3:#9B6BFF; --c4:#3D9BFF; --c5:#2ECC9B;
    --ink:#1F2937; --sub:#6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    color:var(--ink); background:#FDF6F2; overflow-x:hidden;
  }
  /* ===== 背景光斑 ===== */
  .bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:linear-gradient(135deg,#FFF3E8 0%,#FFE9F1 30%,#EDE9FF 62%,#E3F2FF 100%)}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 16s ease-in-out infinite alternate}
  .blob.b1{width:520px;height:520px;background:#FFB37A;top:-140px;left:-120px}
  .blob.b2{width:460px;height:460px;background:#FF9FC3;top:10%;right:-140px;animation-delay:-4s}
  .blob.b3{width:560px;height:560px;background:#B9A5FF;bottom:-180px;left:22%;animation-delay:-8s}
  .blob.b4{width:380px;height:380px;background:#8FD0FF;bottom:-120px;right:8%;animation-delay:-12s}
  @keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(60px,-40px) scale(1.15)}}
  .grid-tex{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(155,107,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(155,107,255,.05) 1px,transparent 1px);background-size:44px 44px}

  /* ===== 导航 ===== */
  nav{position:fixed;top:0;left:0;right:0;z-index:99;display:flex;align-items:center;justify-content:space-between;padding:14px 6vw;transition:.35s}
  nav.scrolled{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);box-shadow:0 6px 24px rgba(31,41,55,.08)}
  .logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;letter-spacing:-1px;color:#004E8C;cursor:pointer}
  .logo b{font-size:22px}
  nav .btn{text-decoration:none;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c3));padding:10px 22px;border-radius:999px;box-shadow:0 8px 20px rgba(255,94,138,.35);transition:.3s}
  nav .btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(255,94,138,.45)}

  /* ===== Hero ===== */
  .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:120px 20px 60px;text-align:center;perspective:1400px}
  .hero-title{font-size:clamp(30px,4.6vw,54px);font-weight:900;letter-spacing:2px;line-height:1.25;background:linear-gradient(90deg,#FF5E3D,#FF2E7E,#9B6BFF,#2E8BFF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:titleIn 1s .2s cubic-bezier(.2,.9,.25,1) both}
  @keyframes titleIn{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
  .hero-sub{margin-top:14px;font-size:clamp(14px,1.6vw,18px);color:var(--sub);animation:titleIn 1s .5s both}

  /* ===== 小i 3D 出场 ===== */
  .stage{position:relative;width:min(88vw,760px);height:min(66vh,560px);margin-top:8px;animation:titleIn 1s .6s both}
  .mascot-wrap{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:min(52vw,300px);perspective:1200px;z-index:5}
  .mascot-3d{position:relative;width:100%;transform-style:preserve-3d;animation:reveal3d 2.4s cubic-bezier(.22,.9,.3,1) both}
  @keyframes reveal3d{
    0%{clip-path:inset(0 0 100% 0);transform:scale(.35) rotateY(-38deg) translateY(120px) translateZ(-60px);opacity:0;filter:blur(6px)}
    38%{clip-path:inset(0 0 52% 0);transform:scale(.62) rotateY(-20deg) translateY(52px) translateZ(-20px);opacity:1;filter:blur(0)}
    68%{clip-path:inset(0 0 12% 0);transform:scale(.86) rotateY(-7deg) translateY(16px) translateZ(-6px)}
    100%{clip-path:inset(0 0 0 0);transform:scale(1) rotateY(0) translateY(0) translateZ(0);opacity:1}
  }
  .mascot-3d img{width:100%;display:block;filter:drop-shadow(0 26px 30px rgba(155,80,160,.35));animation:floaty 4.5s ease-in-out 2.6s infinite}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-16px) rotate(1.2deg)}}
  .mascot-3d::after{content:"";position:absolute;left:50%;bottom:-6%;width:62%;height:34px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(120,60,150,.42),transparent 70%);filter:blur(6px);animation:shadowPulse 4.5s ease-in-out 2.6s infinite}
  @keyframes shadowPulse{0%,100%{transform:translateX(-50%) scale(1);opacity:.85}50%{transform:translateX(-50%) scale(.82);opacity:.5}}
  .halo{position:absolute;left:50%;top:12%;width:110%;height:110%;transform:translate(-50%,-8%);border-radius:50%;background:radial-gradient(circle,rgba(255,94,138,.28),rgba(155,107,255,.18) 45%,transparent 70%);filter:blur(6px);animation:haloPulse 3.6s ease-in-out infinite;z-index:0}
  @keyframes haloPulse{0%,100%{opacity:.65;transform:translate(-50%,-8%) scale(1)}50%{opacity:1;transform:translate(-50%,-8%) scale(1.08)}}

  /* ===== 打招呼气泡 ===== */
  .speech{position:absolute;top:2%;left:50%;transform:translateX(-50%);z-index:20;background:#fff;border:2px solid #FFD9E2;border-radius:24px;padding:16px 28px;box-shadow:0 18px 44px rgba(255,94,138,.28);min-width:min(76vw,420px);max-width:min(88vw,520px);opacity:0;animation:bubblePop .7s cubic-bezier(.22,1.36,.48,1) 2.5s both}
  .speech::after{content:"";position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);border:12px solid transparent;border-top:14px solid #FFD9E2}
  .speech::before{content:"";position:absolute;left:calc(50% - 9px);bottom:-8px;border:9px solid transparent;border-top:10px solid #fff;z-index:1}
  @keyframes bubblePop{0%{opacity:0;transform:translateX(-50%) scale(.5) translateY(20px)}60%{opacity:1;transform:translateX(-50%) scale(1.06) translateY(-4px)}100%{opacity:1;transform:translateX(-50%) scale(1) translateY(0)}}
  .speech h2{font-size:clamp(20px,2.8vw,30px);font-weight:900;color:var(--ink);line-height:1.4;word-break:break-word;white-space:normal;overflow:visible}
  .speech h2 .hl{color:#FF2E7E}
  .caret{display:inline-block;width:3px;height:1.05em;background:#FF2E7E;vertical-align:-0.15em;margin-left:3px;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .speech p{margin-top:6px;font-size:13px;color:#9CA3AF;letter-spacing:1px}

  /* ===== 功能卡飞入（环绕小i） ===== */
  .fly-layer{position:absolute;inset:0;z-index:10;pointer-events:none}
  .fly-card{position:absolute;width:min(38vw,216px);background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:12px;box-shadow:0 18px 44px rgba(60,40,120,.16);opacity:0;cursor:default;transition:transform .35s,box-shadow .35s}
  .fly-card:hover{transform:scale(1.08) !important;box-shadow:0 26px 60px rgba(60,40,120,.28);pointer-events:auto}
  .fly-card .pv{width:100%;height:78px;border-radius:10px;overflow:hidden;background:#fff;border:1px solid #F0EAF6;display:flex;align-items:center;justify-content:center}
  .fly-card .nm{margin-top:8px;font-size:13.5px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px}
  .fly-card .nm i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .fly-card .ds{font-size:11px;color:var(--sub);margin-top:3px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .fc1{left:0;top:8%;animation:pptFly1 1s cubic-bezier(.22,1.36,.48,1) 3.1s both}
  .fc2{right:0;top:6%;animation:pptFly2 1s cubic-bezier(.22,1.36,.48,1) 3.35s both}
  .fc3{left:1%;top:38%;animation:pptFly3 1s cubic-bezier(.22,1.36,.48,1) 3.6s both}
  .fc4{right:1%;top:36%;animation:pptFly4 1s cubic-bezier(.22,1.36,.48,1) 3.85s both}
  .fc5{left:3%;top:66%;animation:pptFly5 1s cubic-bezier(.22,1.36,.48,1) 4.1s both}
  .fc6{right:3%;top:64%;animation:pptFly6 1s cubic-bezier(.22,1.36,.48,1) 4.35s both}
  .fc7{left:14%;top:-4%;animation:pptFly7 1s cubic-bezier(.22,1.36,.48,1) 4.6s both}
  .fc8{right:14%;top:84%;animation:pptFly8 1s cubic-bezier(.22,1.36,.48,1) 4.85s both}
  @keyframes pptFly1{0%{opacity:0;transform:translate(-160px,-40px) rotate(-14deg) scale(.6)}70%{opacity:1;transform:translate(14px,6px) rotate(3deg) scale(1.06)}100%{opacity:1;transform:none}}
  @keyframes pptFly2{0%{opacity:0;transform:translate(160px,-40px) rotate(14deg) scale(.6)}70%{opacity:1;transform:translate(-14px,6px) rotate(-3deg) scale(1.06)}100%{opacity:1;transform:none}}
  @keyframes pptFly3{0%{opacity:0;transform:translate(-180px,0) rotate(10deg) scale(.6)}70%{opacity:1;transform:translate(12px,0) rotate(-2deg) scale(1.05)}100%{opacity:1;transform:none}}
  @keyframes pptFly4{0%{opacity:0;transform:translate(180px,0) rotate(-10deg) scale(.6)}70%{opacity:1;transform:translate(-12px,0) rotate(2deg) scale(1.05)}100%{opacity:1;transform:none}}
  @keyframes pptFly5{0%{opacity:0;transform:translate(-140px,60px) rotate(-8deg) scale(.6)}70%{opacity:1;transform:translate(10px,-6px) rotate(2deg) scale(1.05)}100%{opacity:1;transform:none}}
  @keyframes pptFly6{0%{opacity:0;transform:translate(140px,60px) rotate(8deg) scale(.6)}70%{opacity:1;transform:translate(-10px,-6px) rotate(-2deg) scale(1.05)}100%{opacity:1;transform:none}}
  @keyframes pptFly7{0%{opacity:0;transform:translate(-60px,-160px) rotate(-18deg) scale(.5)}70%{opacity:1;transform:translate(6px,12px) rotate(3deg) scale(1.06)}100%{opacity:1;transform:none}}
  @keyframes pptFly8{0%{opacity:0;transform:translate(60px,160px) rotate(18deg) scale(.5)}70%{opacity:1;transform:translate(-6px,-12px) rotate(-3deg) scale(1.06)}100%{opacity:1;transform:none}}
  .fly-card{animation-fill-mode:both}
  .fly-card:hover{animation-play-state:running}

  /* 迷你预览图（示例图） */
  .pv svg{width:100%;height:100%}

  /* ===== 模块网格 ===== */
  section.cards{padding:90px 6vw 40px;position:relative}
  .sec-title{text-align:center;font-size:clamp(26px,3.4vw,40px);font-weight:900;letter-spacing:1px;margin-bottom:8px}
  .sec-title span{background:linear-gradient(90deg,#FF5E3D,#FF2E7E,#9B6BFF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sec-sub{text-align:center;color:var(--sub);font-size:15px;margin-bottom:48px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;max-width:1200px;margin:0 auto}
  .mod{background:#fff;border-radius:20px;padding:20px;box-shadow:0 12px 32px rgba(60,40,120,.09);border-top:4px solid var(--mc);transition:.4s;opacity:0;transform:translateY(46px)}
  .mod.in{opacity:1;transform:none}
  .mod:hover{transform:translateY(-8px);box-shadow:0 24px 54px rgba(60,40,120,.18)}
  .mod .pv{height:132px;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,var(--mc15),#fff 70%);border:1px solid #F1ECF7;display:flex;align-items:center;justify-content:center}
  .mod h3{margin-top:14px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
  .mod h3 i{width:10px;height:10px;border-radius:50%;background:var(--mc);box-shadow:0 0 0 4px var(--mc15)}
  .mod p{margin-top:8px;font-size:13px;color:var(--sub);line-height:1.6}

  /* ===== 数据条 ===== */
  .stats{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(20px,5vw,70px);padding:70px 6vw;max-width:1200px;margin:0 auto}
  .stat{text-align:center}
  .stat .num{font-size:clamp(30px,3.6vw,46px);font-weight:900;background:linear-gradient(135deg,#FF5E3D,#FF2E7E,#9B6BFF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .stat .lb{margin-top:6px;color:var(--sub);font-size:13px;letter-spacing:1px}

  /* ===== CTA ===== */
  .cta{padding:70px 6vw 90px;text-align:center}
  .cta-box{max-width:820px;margin:0 auto;padding:54px 30px;border-radius:32px;background:linear-gradient(135deg,#FF5E3D,#FF2E7E 40%,#9B6BFF);box-shadow:0 30px 70px rgba(255,46,126,.35);color:#fff;position:relative;overflow:hidden}
  .cta-box::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.14);top:-180px;right:-120px;animation:drift 8s ease-in-out infinite alternate}
  .cta-box h2{font-size:clamp(24px,3vw,38px);font-weight:900;letter-spacing:1px;position:relative}
  .cta-box p{margin:14px 0 30px;opacity:.92;font-size:15px;position:relative}
  .cta-box a{display:inline-block;text-decoration:none;background:#fff;color:#FF2E7E;font-weight:800;padding:14px 40px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.18);transition:.3s;position:relative}
  .cta-box a:hover{transform:translateY(-3px) scale(1.04)}
  footer{padding:34px 6vw;text-align:center;color:#9CA3AF;font-size:12.5px;border-top:1px solid #F0EAF6;background:rgba(255,255,255,.6)}
  footer b{color:#004E8C}

  /* ===== 移动端：飞卡改为网格 ===== */
  @media(max-width:900px){
    .fly-layer{display:none}
    .stage{height:auto}
    .mascot-wrap{position:relative;left:auto;transform:none;width:min(70vw,280px);margin:10px auto 0}
    .speech{top:auto;position:relative;margin:26px auto 0;transform:none;min-width:0;animation:bubblePop .7s cubic-bezier(.22,1.36,.48,1) 2.5s both}
    .speech::after,.speech::before{left:50%}
    @keyframes bubblePop{0%{opacity:0;transform:scale(.5) translateY(20px)}60%{opacity:1;transform:scale(1.06) translateY(-4px)}100%{opacity:1;transform:scale(1) translateY(0)}}
  }
</style>
</head>

const fly = document.getElementById('flyLayer');

  d.innerHTML = '<div class="pv">'+m.svg+'</div><div class="nm"><i style="background:'+m.c+'"></i>'+m.nm+'</div><div class="ds">'+m.ds+'</div>';
  fly.appendChild(d);
});

/* ================= 生成模块网格 ================= */
const grid = document.getElementById('modGrid');
MODULES.forEach((m,i)=>{
  const d = document.createElement('div');
  d.className = 'mod';
  d.style.setProperty('--mc', m.c);
  d.style.setProperty('--mc15', m.c15);
  d.style.transitionDelay = (i%4)*0.08+'s';
  d.innerHTML = '<div class="pv">'+m.svg+'</div><h3><i></i>'+m.nm+'</h3><p>'+m.ds+'</p>';
  grid.appendChild(d);
});

/* ================= 打字机打招呼（完整显示不截断） ================= */
const txt = 'Hi 我是人事小 i，这是我的工作平台';
const el = document.getElementById('speechText');
let ti = 0;
setTimeout(()=>{
  const iv = setInterval(()=>{
    el.textContent = txt.slice(0, ++ti);
    if(ti >= txt.length){ clearInterval(iv); }
  }, 70);
}, 2650);

/* ================= 滚动入场 + 数字滚动 ================= */
const io = new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
},{threshold:.12});
document.querySelectorAll('.mod').forEach(m=>io.observe(m));

const si = new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(!e.isIntersecting) return;
    const t = e.target, n = +t.dataset.n, suf = t.dataset.suffix || '';
    let cur = 0; const step = Math.max(1, Math.round(n/40));
    const iv = setInterval(()=>{
      cur += step;
      if(cur >= n){ cur = n; clearInterval(iv); }
      t.textContent = cur + suf;
    }, 28);
    si.unobserve(t);
  });
},{threshold:.5});
document.querySelectorAll('.stat .num').forEach(n=>si.observe(n));

/* ================= 鼠标视差（小i 立体感） ================= */
const m3d = document.getElementById('mascot3d');
document.addEventListener('mousemove', e=>{
  const x = (e.clientX / innerWidth - .5) * 2;
  const y = (e.clientY / innerHeight - .5) * 2;
  m3d.style.transform = 'rotateY('+(x*8)+'deg) rotateX('+(-y*6)+'deg)';
});

/* ================= 导航吸顶 ================= */
window.addEventListener('scroll', ()=>{
  document.getElementById('nav').classList.toggle('scrolled', scrollY > 40);
});
