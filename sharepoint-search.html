<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR团队资料库 · 模糊搜索</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f0f2f5; min-height:100vh; padding:24px; }
  .wrap { max-width:760px; margin:0 auto; }

  .card {
    background:#fff; border-radius:16px;
    box-shadow:0 4px 24px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);
    overflow:hidden; margin-bottom:18px;
  }
  .card-header {
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    color:#fff; padding:26px 28px 20px;
  }
  .card-header h1 { font-size:21px; font-weight:700; margin-bottom:6px; }
  .card-header p { font-size:13px; opacity:.85; }

  .search-box { display:flex; gap:10px; margin-bottom:18px; padding:0 28px; padding-top:24px; }
  .search-input {
    flex:1; padding:13px 16px; border:2px solid #e5e7eb;
    border-radius:10px; font-size:15px; outline:none; transition:border-color .2s, box-shadow .2s;
  }
  .search-input:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
  .search-btn {
    padding:13px 24px; background:#2563eb; color:#fff; border:none; border-radius:10px;
    font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; transition:background .2s;
  }
  .search-btn:hover { background:#1d4ed8; }

  .option-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; padding:0 28px; }
  .option-chip {
    padding:6px 13px; border-radius:20px; font-size:12px; border:1.5px solid #e5e7eb;
    background:#fff; cursor:pointer; transition:all .2s; color:#4b5563;
  }
  .option-chip:hover { border-color:#3b82f6; color:#2563eb; }
  .option-chip.active { background:#eff6ff; border-color:#3b82f6; color:#2563eb; font-weight:600; }

  .help {
    background:#f8fafc; border-radius:10px; padding:14px 16px; border:1px solid #e5e7eb;
    margin:0 28px 16px; font-size:12.5px; color:#6b7280; line-height:1.9;
  }
  .help b { color:#374151; }
  .help code { background:#eef2f7; padding:1px 6px; border-radius:4px; font-size:12px; color:#2563eb; }

  .quick-links { display:flex; flex-direction:column; gap:8px; margin-top:8px; padding:0 28px 24px; }
  .quick-link {
    display:flex; align-items:center; gap:10px; padding:11px 15px; border:1px solid #e5e7eb;
    border-radius:8px; text-decoration:none; color:#374151; font-size:13.5px; transition:all .2s;
  }
  .quick-link:hover { border-color:#3b82f6; background:#eff6ff; color:#2563eb; }
  .quick-link .icon { font-size:17px; }
  .quick-link .text { flex:1; }
  .quick-link .arrow { color:#9ca3af; font-size:14px; }

  .footer-note { text-align:center; font-size:11.5px; color:#9ca3af; padding:16px; }
  .back-link { display:inline-block; margin-bottom:14px; font-size:13px; color:#2563eb; text-decoration:none; }
  .back-link:hover { text-decoration:underline; }

  /* 搜索提示 */
  .search-hint {
    margin:0 28px 12px; font-size:12px; color:#6b7280; line-height:1.6;
  }
  .search-hint .tag { display:inline-block; background:#eef2f7; padding:1px 7px; border-radius:4px; font-size:11px; color:#4b5563; margin:0 2px; }
</style>
</head>
<body>

<div class="wrap">
  <a class="back-link" href="index.html">← 返回工作平台</a>

  <div class="card">
    <div class="card-header">
      <h1>📂 HR 团队资料库搜索</h1>
      <p>模糊搜索 · 快速定位 · 一键跳转（支持繁简体）</p>
    </div>

    <!-- 搜索区（无Tab，直接展示） -->
    <div style="padding-top:4px;">
      <div class="search-box">
        <input type="text" class="search-input" id="spInput"
          placeholder="输入关键词搜索（如：三大办法、薪酬福利、考勤管理...）支持繁简体"
          onkeydown="if(event.key==='Enter')spSearch()">
        <button class="search-btn" onclick="spSearch()">🔍 搜索</button>
      </div>
      <div class="search-hint" id="searchHint"></div>
      <div class="option-row" id="quickTags"></div>
      <div class="help">
        <b>使用说明：</b>输入关键词后按回车或点击「搜索」，自动跳转到 SharePoint 资料库的搜索结果页。
        支持<b>繁简体自动匹配</b>（输入"三大办法"会同时搜索"三大辦法"等变体）。
        搜索结果在 SharePoint 新标签页打开，<b>需登录 WPG 账号</b>。
      </div>
      <h3 style="font-size:14px;color:#374151;margin-bottom:10px;font-weight:600;padding:0 28px;">🔗 常用快速入口</h3>
      <div class="quick-links" id="quickLinks"></div>
    </div>
  </div>

  <div class="footer-note">
    数据来源：WPG SharePoint · HRMeeting-HR 站点 · HR团队资料库<br>
    需要登录 WPG 账号才能访问 SharePoint 搜索结果
  </div>
</div>

<script>
// ===== SharePoint 配置 =====
var SP_BASE = 'https://wpgh.sharepoint.com';
var SP_SITE = '/sites/HRMeeting-HR';
var SP_LIB_PATH = '/Shared Documents/HR团队资料库';

// ===== 繁简体映射表（HR文档常见字） =====
var S2T_MAP = {
  '办':'辦','业':'業','为':'為','与':'與','专':'專','级':'級','织':'織',
  '综':'綜','职':'職','项':'項','顺':'順','须':'須','险':'險','员':'員',
  '劳':'勞','动':'動','协':'協','报':'報','拟':'擬','认':'認','证':'證',
  '识':'識','财':'財','账':'賬','资':'資','质':'質','达':'達','过':'過',
  '进':'進','选':'選','释':'釋','钟':'鐘','长':'長','门':'門','问':'問',
  '阅':'閱','关':'關','风':'風','飞':'飛','举':'舉','誉':'譽','获':'獲',
  '宝':'寶','实':'實','导':'導','标':'標','机':'機','权':'權','档':'檔',
  '汇':'匯','属':'屬','屡':'屢','屡':'屢','岁':'歲','卫':'衛','现':'現',
  '规':'規','见':'見','义':'義','仪':'儀','两':'兩','严':'嚴','业':'業',
  '优':'優','应':'應','营':'營','拥':'擁','余':'餘','与':'與','愿':'願',
  '云':'雲','杂':'雜','灾':'災','凿':'鑿','轧':'軋','占':'佔','战':'戰',
  '栈':'棧','张':'張','折':'折','征':'徵','症':'癥','证':'證','郑':'鄭',
  '只':'隻','织':'織','职':'職','制':'製','种':'種','众':'眾','周':'週',
  '注':'註','驻':'駐','专':'專','转':'轉','状':'狀','总':'總','组':'組',
  '钻':'鑽'
};

// 常见HR词汇完整繁简对照
var PHRASE_MAP = {
  '三大办法':'三大辦法',
  '工资支付':'工資支付',
  '劳动合同':'勞動合同',
  '绩效考核':'績效考核',
  '薪酬福利':'薪酬福利',
  '考勤管理':'考勤管理',
  '入职指引':'入職指引',
  '离职流程':'離職流程',
  '培训发展':'培訓發展',
  '晋升机制':'晉升機制',
  '社保公积金':'社保公積金',
  '假期制度':'假期制度',
  '差旅报销':'差旅報銷',
  '组织架構':'組織架構',
  '员工手册':'員工手冊',
  '招聘流程':'招聘流程'
};

// ===== Tab 1 数据 =====
var QUICK_TAGS = [
  '薪酬福利', '绩效考核', '招聘流程', '培训发展', '员工手册',
  '考勤管理', '离职流程', '入职指引', '假期制度', '社保公积金',
  '劳动合同', '晋升机制', '差旅报销', '组织架构', '会议纪要',
  '三大办法'  // 用户特别提到的
];
var QUICK_LINKS = [
  { icon:'📁', text:'HR团队资料库（根目录）', url: SP_BASE + ':f:/r' + SP_SITE + '/Shared%20Documents/HR%E5%9B%A2%E9%98%9F%E8%B5%84%E6%96%99%E5%BA%93' },
  { icon:'🔍', text:'SharePoint 全站搜索', url: SP_BASE + SP_SITE + '/_layouts/15/search.aspx' },
  { icon:'📋', text:'最近修改的文件', url: SP_BASE + SP_SITE + '/_layouts/15/viewlsts.aspx' },
  { icon:'⭐', text:'收藏夹 / 已关注', url: SP_BASE + SP_SITE + '/_layouts/15/myfavorites.aspx' },
  { icon:'♻️', text:'回收站', url: SP_BASE + SP_SITE + '/_layouts/15/recyclebin.aspx' }
];

function renderTags() {
  document.getElementById('quickTags').innerHTML = QUICK_TAGS.map(function(t){
    return '<span class="option-chip" onclick="spSearch(\''+t+'\')">'+t+'</span>';
  }).join('');
}
function renderLinks() {
  document.getElementById('quickLinks').innerHTML = QUICK_LINKS.map(function(l){
    return '<a class="quick-link" href="'+l.url+'" target="_blank">'+
      '<span class="icon">'+l.icon+'</span><span class="text">'+l.text+'</span><span class="arrow">→</span></a>';
  }).join('');
}

// 将简体字符串转换为繁体变体
function toTraditional(text) {
  var result = '';
  for (var i = 0; i < text.length; i++) {
    result += S2T_MAP[text[i]] || text[i];
  }
  return result;
}

// 生成搜索提示（显示繁简体变体）
function showSearchHint(q) {
  var hintEl = document.getElementById('searchHint');
  if (!q) { hintEl.innerHTML = ''; return; }
  var trad = toTraditional(q);
  var phraseTrad = PHRASE_MAP[q] || '';
  var hints = [];
  if (trad !== q) hints.push(trad);
  if (phraseTrad && phraseTrad !== trad) hints.push(phraseTrad);
  // 去重
  hints = hints.filter(function(h, i, arr){ return arr.indexOf(h) === i; });
  if (hints.length === 0) { hintEl.innerHTML = ''; return; }
  hintEl.innerHTML = '🔤 同时搜索：<span class="tag">' + hints.join('</span> <span class="tag">') + '</span>';
}

// 监听输入实时更新提示
document.getElementById('spInput').addEventListener('input', function(){
  showSearchHint(this.value.trim());
});

// 执行 SharePoint 站内搜索（使用 u 参数限定站点范围）
function spSearch(q) {
  q = (q || document.getElementById('spInput').value).trim();
  if (!q) { document.getElementById('spInput').focus(); return; }

  // 构建搜索词：原词 + 繁体变体，用 OR 连接
  var tradQ = toTraditional(q);
  var phraseTrad = PHRASE_MAP[q] || '';
  var searchTerms = [q];
  if (tradQ !== q) searchTerms.push(tradQ);
  if (phraseTrad && phraseTrad !== tradQ && phraseTrad !== q) searchTerms.push(phraseTrad);
  // 去重
  searchTerms = searchTerms.filter(function(t, i, arr){ return arr.indexOf(t) === i; });

  var kql = searchTerms.join(' OR ');

  // 使用标准 SharePoint 搜索：k=关键词 + u=站点路径（限定范围）
  // 不再用 r 参数（KQL Result Source），改用更可靠的 u 参数
  var url = SP_BASE + SP_SITE + '/_layouts/15/search.aspx?' +
            'k=' + encodeURIComponent(kql) +
            '&u=' + encodeURIComponent(SP_SITE);

  window.open(url, '_blank');
}

// ===== 初始化 =====
renderTags();
renderLinks();
document.getElementById('spInput').focus();
</script>

</body>
</html>
